<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Details | CyberPath Academy</title>
  <style>
  /* ===== CyberPath Academy - style.css (used by all 12 pages) ===== */

  /* Universal selector: reset spacing for every element */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* ----- Page ----- */
  body {
    font-family: Verdana, Arial, sans-serif;
    background-color: #EEF3FA;
    color: #14375E;
    line-height: 1.6;
  }

  /* ----- Header and menu (ID selectors) ----- */
  #header {
    background-color: #112B50;
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
  }

  #logo {
    color: white;
    font-size: 26px;
    letter-spacing: 1px;
    margin: 0;
  }

  #menu a {
    color: #E8F1FA;
    text-decoration: none;
    font-size: 14px;
    margin-left: 16px;
  }

  #menu a:hover {
    color: #5CC0F0;
  }

  #menu a.active {
    color: #5CC0F0;
    font-weight: bold;
  }

  /* ----- Main content ----- */
  .content {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  h1 {
    font-size: 38px;
    color: #14375E;
    margin-bottom: 10px;
  }

  h2 {
    font-size: 26px;
    margin-top: 30px;
    margin-bottom: 14px;
  }

  h3 {
    font-size: 19px;
    margin-bottom: 8px;
  }

  p {
    margin-bottom: 12px;
  }

  a {
    color: #1585C1;
  }

  ul, ol {
    margin-left: 24px;
    margin-bottom: 12px;
  }

  /* ----- Class selectors ----- */
  .subtitle {
    color: #4A6280;
    font-size: 18px;
    margin-bottom: 24px;
  }

  .small-text {
    color: #4A6280;
    font-size: 14px;
  }

  .greeting {
    font-size: 20px;
    font-weight: bold;
    margin-top: 24px;
  }

  .button {
    display: inline-block;
    background-color: #1585C1;
    color: white;
    padding: 12px 28px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
  }

  .button:hover {
    background-color: #0F6C9C;
  }

  /* ----- Cards ----- */
  .cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    margin-top: 20px;
  }

  .card {
    background-color: white;
    border: 1px solid #C9DCEB;
    border-radius: 14px;
    padding: 14px;
    width: 31%;
    min-width: 260px;
    margin-bottom: 24px;
  }

  .card img {
    width: 100%;
    border-radius: 10px;
    display: block;
    margin-bottom: 12px;
  }

  .half {
    width: 48%;
  }

  /* ----- Boxes ----- */
  .box {
    background-color: white;
    border: 1px solid #C9DCEB;
    border-radius: 14px;
    padding: 24px;
    margin-top: 20px;
  }

  .tip-box {
    background-color: #DCEBF8;
    border-left: 6px solid #1585C1;
    border-radius: 10px;
    padding: 20px;
    margin-top: 20px;
  }

  .hidden-box {
    display: none;
    background-color: #F4F8FC;
    border-left: 5px solid #1585C1;
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 12px;
  }

  /* ----- Lab / article rows ----- */
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
  }

  .row img {
    width: 300px;
    border-radius: 10px;
    margin-right: 24px;
    margin-bottom: 12px;
  }

  .row .text {
    flex: 1;
    min-width: 260px;
  }

  .banner {
    width: 100%;
    max-width: 600px;
    border-radius: 14px;
    display: block;
    margin-bottom: 20px;
  }

  /* ----- Forms ----- */
  .form-box {
    background-color: white;
    border: 1px solid #C9DCEB;
    border-radius: 14px;
    padding: 30px;
    max-width: 480px;
    margin: 0 auto;
  }

  .form-box h1 {
    text-align: center;
  }

  .field {
    width: 100%;
    padding: 12px;
    border: 1px solid #B5CADF;
    border-radius: 10px;
    background-color: #F4F8FC;
    font-size: 15px;
    margin-bottom: 16px;
  }

  label {
    font-weight: bold;
    font-size: 14px;
    display: block;
    margin-bottom: 4px;
  }

  .message {
    font-weight: bold;
    margin-top: 12px;
  }

  .question {
    margin-bottom: 20px;
  }

  .question p {
    font-weight: bold;
    margin-bottom: 6px;
  }

  /* ----- Table ----- */
  table {
    width: 100%;
    border-collapse: collapse;
    background-color: white;
  }

  th, td {
    border: 1px solid #C9DCEB;
    padding: 10px;
    text-align: left;
  }

  th {
    background-color: #112B50;
    color: white;
  }

  /* ----- Glossary ----- */
  .term {
    list-style: none;
    background-color: white;
    border: 1px solid #C9DCEB;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    margin-left: -24px;
  }

  /* ----- Footer ----- */
  #footer {
    background-color: #112B50;
    color: #C9DCEB;
    text-align: center;
    padding: 20px;
    margin-top: 40px;
    font-size: 14px;
  }

  #footer p {
    margin-bottom: 0;
  }
  </style>
</head>
<body>

  <div id="header">
    <h2 id="logo">CYBERPATH</h2>
    <div id="menu">
      <a href="index.html">Home</a>
      <a href="courses.html" class="active">Courses</a>
      <a href="tutorials.html">Tutorials</a>
      <a href="practice-labs.html">Labs</a>
      <a href="challenges.html">Challenges</a>
      <a href="resources.html">Resources</a>
      <a href="blog.html">Blog</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="signup.html">Sign Up</a>
      <a href="login.html">Login</a>
    </div>
  </div>

  <div class="content">
    <p><a href="courses.html">&larr; Back to all courses</a></p>
    <img id="courseImage" class="banner" src="images/course1-basics.png" alt="Course image">
    <h1 id="courseTitle">Course title</h1>
    <p id="courseInfo" class="subtitle"></p>

    <div class="row">
      <img src="images/details-goals.png" alt="Course goals">
      <div class="text">
        <h2 style="margin-top:0">What you will learn</h2>
        <ul id="objectiveList"></ul>
        <h2>Course topics</h2>
        <ol id="topicList"></ol>
      </div>
    </div>

    <button class="button" onclick="startCourse()">Start Learning</button>
  </div>

  <div id="footer">
    <p>CyberPath Academy | ICT 128 Project | Bahaa Hamayel - 20258293 | &copy; 2026</p>
  </div>

  <script>
    var courses = [
      { title: "Cyber Basics", image: "images/course1-basics.png", level: "Beginner", duration: "2 weeks",
        objectives: ["Understand what cybersecurity is", "Recognise common online threats", "Build simple safe habits"],
        topics: ["What is cybersecurity?", "Viruses, scams and phishing", "Protecting personal information", "Safe habits online"] },
      { title: "Password Safety", image: "images/course2-passwords.png", level: "Beginner", duration: "1 week",
        objectives: ["Know why weak passwords are risky", "Create strong passwords", "Use two-factor authentication"],
        topics: ["Why passwords get stolen", "Strong passwords and passphrases", "Password managers", "Two-factor authentication"] },
      { title: "Phishing Awareness", image: "images/course3-phishing.png", level: "Beginner", duration: "1 week",
        objectives: ["Spot fake emails and messages", "Recognise fake websites", "Know what to do after a mistake"],
        topics: ["What is phishing?", "Warning signs in emails", "Fake websites and links", "What to do if you clicked"] },
      { title: "Safe Browsing", image: "images/course4-browsing.png", level: "Beginner", duration: "1 week",
        objectives: ["Understand HTTPS and the padlock", "Download files safely", "Protect your privacy online"],
        topics: ["HTTPS and the padlock", "Safe downloads", "Cookies and privacy", "Risky websites"] },
      { title: "Device Security", image: "images/course5-devices.png", level: "Beginner", duration: "1 week",
        objectives: ["Keep devices updated", "Use screen locks and antivirus", "Back up important files"],
        topics: ["Software updates", "Antivirus basics", "Screen locks and PINs", "Backing up your files"] },
      { title: "Wi-Fi and Network Safety", image: "images/course6-network.png", level: "Beginner", duration: "1 week",
        objectives: ["Secure your home Wi-Fi", "Understand public Wi-Fi risks", "Know what a VPN does"],
        topics: ["Home Wi-Fi settings", "Public Wi-Fi risks", "What is a VPN?", "Router safety"] }
    ];

    var currentCourse = 0;

    function loadCourse() {
      // The link looks like: course-details.html#2  (the number after # is the course)
      var id = Number(location.hash.substring(1));
      if (isNaN(id) || id < 0 || id >= courses.length) {
        id = 0;
      }
      currentCourse = id;
      var c = courses[id];

      document.title = c.title + " | CyberPath Academy";
      document.getElementById("courseTitle").textContent = c.title;
      document.getElementById("courseImage").src = c.image;
      document.getElementById("courseInfo").textContent = "Level: " + c.level + " | Duration: " + c.duration;

      var objList = document.getElementById("objectiveList");
      for (var i = 0; i < c.objectives.length; i++) {
        var li = document.createElement("li");
        li.textContent = c.objectives[i];
        objList.appendChild(li);
      }

      var topicList = document.getElementById("topicList");
      for (var j = 0; j < c.topics.length; j++) {
        var li2 = document.createElement("li");
        li2.textContent = c.topics[j];
        topicList.appendChild(li2);
      }
    }

    function startCourse() {
      alert("You have started: " + courses[currentCourse].title + ". Let's go to the tutorials!");
      window.location.href = "tutorials.html";
    }

    loadCourse();
  </script>
</body>
</html>
